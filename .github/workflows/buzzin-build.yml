---
name: "Buzzin Build"

# Build pod nasz fork. Upstreamowy build-containers.yml pcha do
# ghcr.io/gitroomhq/... czego nie mozemy zapisac, i buduje dwie architektury.
# Nasz VPS jest amd64, wiec arm64 bylby czystym marnotrawstwem czasu builda.
on:
  workflow_dispatch:
  push:
    branches:
      - 'buzzin/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Slug branch name
        id: slug
        run: |
          echo "tag=$(echo '${{ github.ref_name }}' | tr '/' '-' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.slug.outputs.tag }}-${{ steps.slug.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/postiz-app:${{ steps.slug.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/postiz-app:${{ steps.slug.outputs.tag }}-${{ steps.slug.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/postiz-app:${{ steps.slug.outputs.tag }}-${{ steps.slug.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
